<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
  <title>Design System</title>
</head>
<body class="design">
  <section id="tipografia">
    <h1> Teste h1 </h1>
    <h2> Teste h2 </h2>
    <h3> Teste h3 </h3>
    <h4> Teste h4 </h4>
    <h5> Teste h5 </h5>
    <h6> Teste h6 </h6>
    <p> Teste p </p>
    <small>Teste small</small>
  </section>
  
  <section id="buttons" class="flex--st">
    <button>Medium button</button>
    <button class="btn btn--secondary">Button secondary</button>
    <button class="btn btn--rounded btn--secondary">Button secondary</button>
    <a href="" class="btn btn--link">Button link</a>
    <input type="submit" value="Botao">
  </section>
  
  <section id="chips">
    <div class="chips chips--andamento">
      <div class="chips__text">
        chips--andamento
      </div>
    </div>
    <div class="chips chips--concluido">
      <div class="chips__text">
        chips--concluido
      </div>
    </div>
    <div class="chips chips--cancelado">
      <div class="chips__text">
        chips--cancelado
      </div>
    </div>
  </section>
  
  <section id="icons">
    <i class="bx bx-home"></i>
    <i class="bx bx-info-circle"></i>
    <i class="bx bx-user"></i>
    <i class="bx bx-phone"></i>
    <i class="bx bx-envelope"></i>
    <i class="bx bx-arrow-out-right-square-half"></i>
    <i class="bx bx-share"></i>
  </section>
  
</body>
</html>
